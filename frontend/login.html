<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DojoFlow - Acceso Coach</title>
    <!-- Incluimos SweetAlert2 para las alertas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Estilos base con temática oscura para DojoFlow */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .auth-container {
            background-color: #1e1e1e;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 380px;
            border-top: 4px solid #e53935; /* Un toque rojo agresivo/marcial */
        }
        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #e53935;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p.subtitulo {
            text-align: center;
            color: #aaaaaa;
            font-size: 0.85rem;
            margin-top: -1rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #bbbbbb;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #333333;
            background-color: #2c2c2c;
            color: #ffffff;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #e53935;
        }
        .btn {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }
        .btn-primary {
            background-color: #e53935;
            color: white;
        }
        .btn-primary:hover {
            background-color: #c62828;
        }
        .toggle-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #888888;
            cursor: pointer;
            transition: color 0.3s;
        }
        .toggle-text:hover {
            color: #e53935;
            text-decoration: underline;
        }
        .link-olvide {
            text-align: right;
            font-size: 0.8rem;
            color: #888888;
            cursor: pointer;
            margin-top: -0.5rem;
            margin-bottom: 1rem;
        }
        .link-olvide:hover {
            color: #e53935;
            text-decoration: underline;
        }

        /* Clase para ocultar formularios dinámicamente */
        .oculto { display: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <div id="loginSection">
            <h2>Acceso Coach</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Correo</label>
                    <input type="email" id="loginEmail" placeholder="tucorreo@ejemplo.com" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="Tu contraseña" required autocomplete="current-password">
                </div>
                <div class="link-olvide" onclick="mostrarSeccion('forgotSection')">¿Olvidaste tu contraseña?</div>
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </form>
            <div class="toggle-text" onclick="mostrarSeccion('signupSection')">¿No tienes acceso? Registra un nuevo Coach aquí</div>
        </div>

        <!-- FORMULARIO DE REGISTRO (Oculto por defecto) -->
        <div id="signupSection" class="oculto">
            <h2>Registrar Coach</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="signupNombre">Nombre</label>
                    <input type="text" id="signupNombre" placeholder="Ej. Carlos Llanes" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="signupEmail">Correo</label>
                    <input type="email" id="signupEmail" placeholder="tucorreo@ejemplo.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="signupPassword">Contraseña de acceso</label>
                    <input type="password" id="signupPassword" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" minlength="6">
                </div>
                <button type="submit" class="btn btn-primary">Crear Cuenta</button>
            </form>
            <div class="toggle-text" onclick="mostrarSeccion('loginSection')">Ya tengo cuenta. Volver al Login</div>
        </div>

        <!-- RECUPERACIÓN DE CONTRASEÑA (Oculto por defecto) -->
        <div id="forgotSection" class="oculto">
            <h2>Recuperar Acceso</h2>
            <p class="subtitulo">Te enviaremos un PIN de 6 dígitos a tu correo.</p>

            <form id="pedirPinForm">
                <div class="form-group">
                    <label for="forgotEmail">Correo</label>
                    <input type="email" id="forgotEmail" placeholder="tucorreo@ejemplo.com" required autocomplete="email">
                </div>
                <button type="submit" class="btn btn-primary" id="btnPedirPin">Enviar PIN</button>
            </form>

            <form id="resetPasswordForm" class="oculto">
                <div class="form-group">
                    <label for="resetPin">PIN recibido por correo</label>
                    <input type="text" id="resetPin" placeholder="123456" required maxlength="6" inputmode="numeric">
                </div>
                <div class="form-group">
                    <label for="resetPassword">Nueva contraseña</label>
                    <input type="password" id="resetPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary">Restablecer contraseña</button>
            </form>

            <div class="toggle-text" onclick="mostrarSeccion('loginSection')">Volver al Login</div>
        </div>
    </div>

    <script>
        const API_URL = '/api/Auth';

        // Alterna entre login / registro / recuperación de contraseña
        function mostrarSeccion(idSeccion) {
            ['loginSection', 'signupSection', 'forgotSection'].forEach(id => {
                document.getElementById(id).classList.toggle('oculto', id !== idSeccion);
            });

            if (idSeccion === 'forgotSection') {
                document.getElementById('pedirPinForm').classList.remove('oculto');
                document.getElementById('resetPasswordForm').classList.add('oculto');
            }
        }

        function mostrarError(mensaje) {
            Swal.fire({
                icon: 'error',
                title: 'Atención',
                text: mensaje,
                background: '#1e1e1e', color: '#fff',
                confirmButtonColor: '#e53935'
            });
        }

        // 1. INICIO DE SESIÓN
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('coachToken', data.token);

                    Swal.fire({
                        icon: 'success',
                        title: 'Acceso Concedido',
                        text: data.mensaje,
                        background: '#1e1e1e', color: '#fff',
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = 'index.html';
                    });
                } else {
                    mostrarError(data.error);
                }
            } catch (error) {
                console.error("Error al conectar con la API:", error);
                Swal.fire('Error de conexión', 'No se pudo contactar al servidor de DojoFlow.', 'error');
            }
        });

        // 2. REGISTRO DE COACH
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('signupNombre').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            try {
                const response = await fetch(`${API_URL}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Registro Exitoso',
                        text: data.mensaje,
                        background: '#1e1e1e', color: '#fff',
                        confirmButtonColor: '#4CAF50'
                    }).then(() => {
                        document.getElementById('signupForm').reset();
                        mostrarSeccion('loginSection');
                    });
                } else {
                    mostrarError(data.error);
                }
            } catch (error) {
                console.error("Error al conectar con la API:", error);
                Swal.fire('Error de conexión', 'No se pudo contactar al servidor de DojoFlow.', 'error');
            }
        });

        // 3. SOLICITAR PIN DE RECUPERACIÓN
        document.getElementById('pedirPinForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('forgotEmail').value;
            const boton = document.getElementById('btnPedirPin');
            boton.disabled = true;
            boton.textContent = 'Enviando...';

            try {
                const response = await fetch(`${API_URL}/olvide-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Revisa tu correo',
                        text: data.mensaje,
                        background: '#1e1e1e', color: '#fff',
                        confirmButtonColor: '#4CAF50'
                    });
                    document.getElementById('resetPasswordForm').classList.remove('oculto');
                } else {
                    mostrarError(data.error);
                }
            } catch (error) {
                console.error("Error al conectar con la API:", error);
                Swal.fire('Error de conexión', 'No se pudo contactar al servidor de DojoFlow.', 'error');
            } finally {
                boton.disabled = false;
                boton.textContent = 'Enviar PIN';
            }
        });

        // 4. RESTABLECER CONTRASEÑA CON EL PIN
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('forgotEmail').value;
            const pin = document.getElementById('resetPin').value;
            const nuevaPassword = document.getElementById('resetPassword').value;

            try {
                const response = await fetch(`${API_URL}/resetear-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, pin, nuevaPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Listo!',
                        text: data.mensaje,
                        background: '#1e1e1e', color: '#fff',
                        confirmButtonColor: '#4CAF50'
                    }).then(() => {
                        document.getElementById('pedirPinForm').reset();
                        document.getElementById('resetPasswordForm').reset();
                        mostrarSeccion('loginSection');
                    });
                } else {
                    mostrarError(data.error);
                }
            } catch (error) {
                console.error("Error al conectar con la API:", error);
                Swal.fire('Error de conexión', 'No se pudo contactar al servidor de DojoFlow.', 'error');
            }
        });
    </script>
</body>
</html>
